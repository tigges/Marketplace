name = "appbazaar-router"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Durable Object holding per-session state (SSE stream + fan-out + metadata).
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "AppbazaarSessionDO"

[[migrations]]
tag = "v1"
new_classes = ["AppbazaarSessionDO"]

# Hyperdrive pools connections to managed Postgres (Supabase) from the edge.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

# Secrets (set via `wrangler secret put`):
#   DATABASE_URL              - Supabase Postgres connection string (if not using Hyperdrive)
#   UPSTASH_REDIS_REST_URL    - Upstash Redis REST URL (cross-region backplane / metrics)
#   UPSTASH_REDIS_REST_TOKEN  - Upstash Redis REST token
[vars]
PLATFORM_FEE_BPS = "1000"
